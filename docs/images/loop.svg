<svg xmlns="http://www.w3.org/2000/svg" width="780" height="250" viewBox="0 0 780 250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<defs>
  <marker id="loop-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
  </marker>
</defs>
<rect width="780" height="250" fill="#f6f8fa"/>
<rect x="24" y="70" width="168" height="74" rx="8" fill="#ffffff" stroke="#d0d7de"/>
      <text x="38" y="96" font-size="12.5" font-weight="600" fill="#1f2328">拆解</text>
      <text x="38" y="116" font-size="10.5" fill="#6b7280">核心意图 · 交付物</text>
      <text x="38" y="132" font-size="10.5" fill="#6b7280">验收 · 不做什么</text>
<rect x="218" y="70" width="168" height="74" rx="8" fill="#ffffff" stroke="#d0d7de"/>
      <text x="232" y="96" font-size="12.5" font-weight="600" fill="#1f2328">任务树</text>
      <text x="232" y="116" font-size="10.5" fill="#6b7280">状态 · 原因 · 历史</text>
      <text x="232" y="132" font-size="10.5" fill="#6b7280">分支 · 前置 · 产出</text>
<rect x="412" y="70" width="168" height="74" rx="8" fill="#ffffff" stroke="#d0d7de"/>
      <text x="426" y="96" font-size="12.5" font-weight="600" fill="#1f2328">每步注入</text>
      <text x="426" y="116" font-size="10.5" fill="#6b7280">[任务图谱] 一小段</text>
      <text x="426" y="132" font-size="10.5" fill="#6b7280">按签名去重</text>
<rect x="606" y="70" width="150" height="74" rx="8" fill="#ffffff" stroke="#d0d7de"/>
      <text x="620" y="96" font-size="12.5" font-weight="600" fill="#1f2328">模型</text>
      <text x="620" y="116" font-size="10.5" fill="#6b7280">知道自己在哪</text>
      <text x="620" y="132" font-size="10.5" fill="#6b7280">不用重读全部历史</text>
<line x1="192" y1="107" x2="218" y2="107" stroke="#6b7280" stroke-width="1.4" marker-end="url(#loop-arrow)"/>
<line x1="386" y1="107" x2="412" y2="107" stroke="#6b7280" stroke-width="1.4" marker-end="url(#loop-arrow)"/>
<line x1="580" y1="107" x2="606" y2="107" stroke="#6b7280" stroke-width="1.4" marker-end="url(#loop-arrow)"/>
<path d="M 681 144 L 681 196 L 108 196 L 108 144" fill="none" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#loop-arrow)"/>
<text x="330" y="214" font-size="10.5" fill="#6b7280">回合结束时回写真实进展：完成、返工、阻塞、分支、产出</text>
</svg>
